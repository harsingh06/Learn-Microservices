# Reusable pipeline shared by the three .NET services.
# Each service's thin workflow calls this with its own names, so a change to
# one service builds, tests, and deploys ONLY that service.
#
# Deploying = `terraform apply` of the service's own stack (src/<Service>/infra)
# with the image just pushed. That stack owns the service's container app —
# image included — so no other pipeline ever writes to it.
name: service-pipeline

on:
  workflow_call:
    inputs:
      service-name:
        description: Project folder name, e.g. CandidateService
        required: true
        type: string
      image-name:
        description: ACR repository name, e.g. candidate-service
        required: true
        type: string
      deploy:
        description: Deploy to Azure after a green build (push to main only)
        required: true
        type: boolean

# OIDC for Terraform (azurerm provider + backend + the platform's remote state).
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Format check
        run: |
          dotnet format src/${{ inputs.service-name }}/${{ inputs.service-name }}.csproj --verify-no-changes
          dotnet format tests/${{ inputs.service-name }}.Tests/${{ inputs.service-name }}.Tests.csproj --verify-no-changes

      - name: Build
        run: dotnet build src/${{ inputs.service-name }} -c Release

      - name: Test
        run: >
          dotnet test tests/${{ inputs.service-name }}.Tests -c Release
          --collect:"XPlat Code Coverage" --results-directory coverage

      # Coverage is reported, never enforced — a threshold would invite gaming
      # it. The summary lands on the run's page.
      - name: Coverage summary
        if: always()
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:MarkdownSummaryGithub \
            -title:"${{ inputs.service-name }}"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  # PRs: show what merging would do to this service's app (fmt, validate, plan).
  infra-plan:
    # Dependabot PRs run without secrets, so they cannot log in to Azure to plan.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: src/${{ inputs.service-name }}/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # The image tag is illustrative: the real deploy uses the merge commit's SHA.
      - name: Plan
        run: |
          terraform plan -no-color -input=false -lock=false \
            -var image=${{ vars.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.event.pull_request.head.sha }} \
            > plan.txt
          { echo '### Terraform plan — ${{ inputs.service-name }}'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-test
    if: inputs.deploy
    runs-on: ubuntu-latest
    # One deploy per service at a time; a later merge waits instead of racing
    # the earlier one for the state lock.
    concurrency:
      group: deploy-${{ inputs.image-name }}
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC token for azure/login — no stored credentials
      contents: read
      security-events: write # upload Trivy findings to the Security tab
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image (tag = commit SHA)
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker build -t "$IMAGE" src/${{ inputs.service-name }}

      # Scan BEFORE push, so a vulnerable image never reaches the registry.
      - name: Scan image (fails on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Collect HIGH+CRITICAL findings
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ inputs.image-name }}

      - name: Push image
        run: docker push "$IMAGE"

      - uses: hashicorp/setup-terraform@v3

      # Rolls out a new revision with the new image (and any change to the
      # service's app definition in the same commit).
      - name: Deploy (terraform apply)
        working-directory: src/${{ inputs.service-name }}/infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -no-color -var image="$IMAGE"
