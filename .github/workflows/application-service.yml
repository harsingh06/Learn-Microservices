name: application-service

on:
  push:
    branches: [main]
    paths:
      - "src/ApplicationService/**"
      - "tests/ApplicationService.Tests/**"
      - ".github/workflows/application-service.yml"
      - ".github/workflows/service-pipeline.yml"
  pull_request:
    paths:
      - "src/ApplicationService/**"
      - "tests/ApplicationService.Tests/**"
      - ".github/workflows/application-service.yml"
      - ".github/workflows/service-pipeline.yml"
  # Manual redeploy of the current main (e.g. after the environment is recreated).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # A reusable workflow cannot request more than its caller grants; the deploy
  # job uploads Trivy findings, so the caller must allow it here too.
  security-events: write

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service-name: ApplicationService
      image-name: application-service
      app-name: ca-ats-application-prod-cin-01
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    secrets: inherit
