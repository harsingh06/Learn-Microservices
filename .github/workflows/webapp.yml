# The webapp pipeline differs from the services: Node build instead of dotnet.
# In Azure the webapp and the APIs share one origin (the route config), so the
# bundle calls relative /api paths and the image is the same in every environment.
name: webapp

on:
  push:
    branches: [main]
    paths:
      - "src/WebApp/**"
      - ".github/workflows/webapp.yml"
      - "infra/modules/**"
  pull_request:
    paths:
      - "src/WebApp/**"
      - ".github/workflows/webapp.yml"
      - "infra/modules/**"
  # Manual redeploy of the current main (e.g. after the environment is recreated).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# OIDC for Terraform (azurerm provider + backend + the platform's remote state).
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  # PRs: show what merging would do to the webapp's app (fmt, validate, plan).
  infra-plan:
    # Dependabot PRs run without secrets, so they cannot log in to Azure to plan.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApp/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # The image tag is illustrative: the real deploy uses the merge commit's SHA.
      - name: Plan
        run: |
          terraform plan -no-color -input=false -lock=false \
            -var image=${{ vars.ACR_LOGIN_SERVER }}/webapp:${{ github.event.pull_request.head.sha }} \
            > plan.txt
          { echo '### Terraform plan — WebApp'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a later merge waits instead of racing for the state lock.
    concurrency:
      group: deploy-webapp
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      security-events: write # upload Trivy findings to the Security tab
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/webapp:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Empty VITE_API_URL = same-origin relative /api calls (the Dockerfile's
      # default, localhost:5104, is for docker-compose only).
      - name: Build image (tag = commit SHA)
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker build -t "$IMAGE" \
            --build-arg VITE_API_URL= \
            src/WebApp

      # Scan BEFORE push, so a vulnerable image never reaches the registry.
      - name: Scan image (fails on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Collect HIGH+CRITICAL findings
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-webapp

      - name: Push image
        run: docker push "$IMAGE"

      - uses: hashicorp/setup-terraform@v3

      # The webapp's own stack (src/WebApp/infra) owns its container app, image
      # included — this rolls out a new revision with the new image.
      - name: Deploy (terraform apply)
        working-directory: src/WebApp/infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -no-color -var image="$IMAGE"
