# The webapp pipeline differs from the services: Node build instead of dotnet.
# In Azure the webapp and the APIs share one origin (the route config), so the
# bundle calls relative /api paths and the image is the same in every environment.
name: webapp

on:
  push:
    branches: [main]
    paths:
      - "src/WebApp/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "src/WebApp/**"
      - ".github/workflows/webapp.yml"
  # Manual redeploy of the current main (e.g. after the environment is recreated).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/WebApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write # upload Trivy findings to the Security tab
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/webapp:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Empty VITE_API_URL = same-origin relative /api calls (the Dockerfile's
      # default, localhost:5104, is for docker-compose only).
      - name: Build image (tag = commit SHA)
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker build -t "$IMAGE" \
            --build-arg VITE_API_URL= \
            src/WebApp

      # Scan BEFORE push, so a vulnerable image never reaches the registry.
      - name: Scan image (fails on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Collect HIGH+CRITICAL findings
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload findings to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-webapp

      - name: Push image
        run: docker push "$IMAGE"

      - name: Roll out new revision
        run: |
          az containerapp update \
            --name ats-webapp \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image "$IMAGE"
