# Static analysis (SAST) for our own code. Deliberately NOT path-filtered: these
# are the checks branch protection requires, so they must run on every PR.
# Findings appear under the repository's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new rules find old code even when nothing changes.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      # build-mode: none — CodeQL analyses the source directly, so the workflow
      # doesn't need the .NET/Node toolchains or a successful build.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
