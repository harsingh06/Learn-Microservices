name: gateway

on:
  push:
    branches: [main]
    paths:
      - "src/ApiGateway/**"
      - ".github/workflows/gateway.yml"
      - ".github/workflows/service-pipeline.yml"
  pull_request:
    paths:
      - "src/ApiGateway/**"
      - ".github/workflows/gateway.yml"
      - ".github/workflows/service-pipeline.yml"

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service-name: ApiGateway
      image-name: api-gateway
      app-name: ats-gateway
      # The gateway is pure configuration — no test project (see BACKLOG.md).
      run-tests: false
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
