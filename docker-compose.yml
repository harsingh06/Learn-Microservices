services:

  # Azure Cosmos DB emulator (Linux "vnext" preview: light, fast, plain HTTP).
  # Data Explorer UI: http://localhost:1234
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    ports:
      - "8081:8081"
      - "1234:1234"

  candidate-service:
    build: src/CandidateService
    ports:
      - "5101:8080"
    environment:
      Cosmos__Endpoint: http://cosmos:8081
    depends_on:
      - cosmos

  job-service:
    build: src/JobService
    ports:
      - "5102:8080"
    environment:
      Cosmos__Endpoint: http://cosmos:8081
    depends_on:
      - cosmos

  application-service:
    build: src/ApplicationService
    ports:
      - "5103:8080"
    environment:
      Cosmos__Endpoint: http://cosmos:8081
      # Service-to-service calls use the Docker network, not localhost.
      Services__CandidateApi: http://candidate-service:8080
      Services__JobApi: http://job-service:8080
    depends_on:
      - cosmos
      - candidate-service
      - job-service

  # LOCAL stand-in for ACA's rule-based routing (in Azure this is the
  # environment httpRouteConfig, not a container). Single API origin: routes
  # /api/<resource>/* to the services. Config: local/dev-router/default.conf
  dev-router:
    image: nginx:alpine
    ports:
      - "5104:80"
    volumes:
      - ./local/dev-router/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - candidate-service
      - job-service
      - application-service

  # Static files only. The browser calls the API origin (baked-in
  # localhost:5104 matches the dev-router port mapping above).
  webapp:
    build: src/WebApp
    ports:
      - "5100:80"
    depends_on:
      - dev-router
