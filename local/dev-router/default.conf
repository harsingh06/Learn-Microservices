# LOCAL DEV ONLY — never deployed.
# Stand-in for Azure Container Apps rule-based routing (the environment-level
# httpRouteConfig): one origin, /api/<resource>/* forwarded to the owning
# service with the /api prefix stripped. Mounted into a stock nginx container
# by docker-compose.
server {
    listen 80;

    location /api/candidates {
        proxy_pass http://candidate-service:8080/candidates;
    }

    location /api/jobs {
        proxy_pass http://job-service:8080/jobs;
    }

    location /api/applications {
        proxy_pass http://application-service:8080/applications;
    }
}
